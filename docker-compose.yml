services:
  mysql:
    image: mysql:lts
    container_name: UngDungGoiXe
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: UngDungGoiXe
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-networks
  redis:
    image: redis:8.6.2
    container_name: redis_be
    ports:
      - 6379:6379
    command: ["redis-server","--requirepass","12345678"]
    networks:
      - app-networks
  backend-rent:
    image: dangkhoi081f/backend-rent-car:1.0
    env_file:
      - .env
    ports:
      - 8080:8080
    networks:
      - app-networks

volumes:
  mysql_data:

networks:
  app-networks: