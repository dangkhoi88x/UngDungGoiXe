name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/backend-rent-car

jobs:
  docker-build-push:
    name: Docker build and push
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.event.workflow_run.head_sha }}

  deploy-backend:
    name: Deploy backend to EC2
    runs-on: ubuntu-latest
    needs:
      - docker-build-push

    steps:
      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
          DEPLOY_COMPOSE_FILE: ${{ secrets.EC2_COMPOSE_FILE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: DOCKER_IMAGE,DEPLOY_PATH,DEPLOY_COMPOSE_FILE
          script_stop: true
          script: |
            set -e
            APP_DIR="${DEPLOY_PATH:-/home/ubuntu}"
            cd "$APP_DIR"
            COMPOSE_FILE="${DEPLOY_COMPOSE_FILE:-docker-compose.yml}"
            if [ ! -f "$COMPOSE_FILE" ]; then
              if [ -f compose.yml ]; then
                COMPOSE_FILE="compose.yml"
              elif [ -f compose.yaml ]; then
                COMPOSE_FILE="compose.yaml"
              else
                echo "Cannot find docker compose file in $APP_DIR"
                exit 1
              fi
            fi
            sudo sed -i.bak -E "s#image:[[:space:]]+[^[:space:]]*/backend-rent-car:[^[:space:]]+#image: ${DOCKER_IMAGE}:latest#g" "$COMPOSE_FILE"
            sudo docker compose -f "$COMPOSE_FILE" pull backend-rent
            sudo docker compose -f "$COMPOSE_FILE" up -d backend-rent
            sudo docker image prune -f
            sudo docker compose -f "$COMPOSE_FILE" ps
